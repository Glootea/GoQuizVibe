version: "2"

sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/migrations"    
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            nullable: true
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"
          - db_type: "text"
            nullable: true
            go_type: "string"
          - db_type: "text"
            nullable: false
            go_type: "string"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: false
            go_type: "int"
          - db_type: "pg_catalog.bool"
            nullable: false
            go_type: "bool"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type: "bool"