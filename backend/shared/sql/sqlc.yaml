version: "2"

sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"    
    gen:
      go:
        package: "db"
        out: "../db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "NullTime"
              import: "database/sql"
          - db_type: "timestamptz"
            nullable: false
            go_type: "time.Time"
          - db_type: "text"
            nullable: true
            go_type: "string"
          - db_type: "text"
            nullable: false
            go_type: "string"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: false
            go_type: "int"
          - db_type: "pg_catalog.bool"
            nullable: false
            go_type: "bool"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type: "bool"
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type: "float64"
          - db_type: "pg_catalog.float8"
            nullable: false
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type: "float64"
          - db_type: "group_role"
            go_type:
              type: "GroupRole"
          - db_type: "permission_type"
            go_type:
              type: "PermissionType"
          - db_type: "recipient_type"
            go_type:
              type: "RecipientType"
          - db_type: "asset_type"
            go_type:
              type: "AssetType"
          - db_type: "student_permission"
            go_type:
              type: "StudentPermission"