apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: goquizvibe
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'goquizvibe'
        static_configs:
          - targets: ['backend-service:443']
        metrics_path: '/metrics'
        scrape_interval: 15s

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']
        scrape_interval: 15s
