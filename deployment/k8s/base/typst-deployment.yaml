apiVersion: apps/v1
kind: Deployment
metadata:
  name: typst
  namespace: goquizvibe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typst
  template:
    metadata:
      labels:
        app: typst
    spec:
      containers:
        - name: typst
          image: localhost:5000/typst:latest
          ports:
            - containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "9090"
          envFrom:
            - configMapRef:
                name: goquizvibe-config
            - secretRef:
                name: goquizvibe-secrets
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
