apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: goquizvibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost/backend
          ports:
            - containerPort: 443
          envFrom:
            - configMapRef:
                name: goquizvibe-config
            - secretRef:
                name: goquizvibe-secrets
          livenessProbe:
            httpGet:
              path: /
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 5