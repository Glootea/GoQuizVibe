apiVersion: v1
kind: ConfigMap
metadata:
  name: goquizvibe-config
  namespace: goquizvibe
data:
  PORT: "443"
  POSTGRES_HOST: "postgres-service"
  DB_PORT: "5432"
  POSTGRES_USER: "goquizvibe"
  POSTGRES_DB: "goquizvibe"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_BUCKET: "question-images"
  REDIS_HOST: "redis-service"
  REDIS_CACHE_TTL: "15m"
  QUIZ_TIMER_CRON_INTERVAL: "10m"
  GRPC_PORT: "9100"
  TYPST_SERVICE_ADDR: "typst-service:9090"
