syntax = "proto3";

package typst;

option go_package = "github.com/goquizvibe/microservices/typst/internal/server/proto";

service TypstCompiler {
  rpc Compile(CompileRequest) returns (CompileResponse);
}

message CompileRequest {
  string material_id = 1;
  string source_path = 2;
}

message CompileResponse {
  string pdf_path = 1;
  string errors = 2;
  bool success = 3;
}